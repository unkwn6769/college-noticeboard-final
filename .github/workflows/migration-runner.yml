name: Migration runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      idle_timeout_ms:
        description: "How long the disposable runner may wait for work"
        required: false
        default: "300000"

jobs:
  migrate:
    concurrency:
      group: college-noticeboard-migration-runner
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      MIGRATION_RUNNER_IDLE_TIMEOUT_MS: ${{ inputs.idle_timeout_ms }}
      MIGRATION_FILE_WORKERS_MIN: "1"
      MIGRATION_FILE_WORKERS_INITIAL: "1"
      MIGRATION_FILE_WORKERS_MAX: "60"
      MIGRATION_MAX_CONCURRENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: node server/run-migration-runner.js
