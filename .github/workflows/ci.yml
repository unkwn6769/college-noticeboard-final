name: CI

on:
  push:
    branches:
      - main
      - migration-engine-redesign
      - badrisatwik-migration-engine-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check server JavaScript syntax
        run: |
          find server -path '*/node_modules' -prune -o -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Run database-independent server tests
        run: node --test server/migrationDriveCopy.test.js server/storage/storageFileTypes.test.js server/storage/storageHealth.test.js
      - name: Run repository static verification
        run: bash scripts/verify-final.sh
      - name: Run database integration tests when credentials are available
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm test
          else
            echo "DATABASE_URL is not configured; skipping database integration tests."
          fi

  frontend-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm --prefix cloudflare/api ci
      - name: Typecheck Worker
        run: cd cloudflare/api && npx tsc -p tsconfig.json --noEmit
      - name: Run database-independent Worker tests
        working-directory: cloudflare/api
        run: node --import tsx --test src/auth/encryption.test.ts src/google/drive.test.ts src/google/driveCopy.test.ts src/google/errors.test.ts src/google/resumableUpload.test.ts
      - name: Run Worker database integration tests when credentials are available
        working-directory: cloudflare/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm test
          else
            echo "DATABASE_URL is not configured; skipping Worker database integration tests."
          fi
